<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hafiz — Asisten Cerdas Penghafal Al-Qur'an</title>
<meta name="description" content="Aplikasi PWA untuk menghafal Al-Qur'an dengan mushaf pojok, setoran suara, dan sistem Sabak-Sabqi-Manzil.">
<meta name="theme-color" content="#4a7c59">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Scheherazade+New:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/mushaf.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="app-shell">

  <header id="app-header">
    <button id="btn-back" class="icon-btn" aria-label="Kembali" style="visibility:hidden;">←</button>
    <h1 id="page-title">Hafiz</h1>
    <button id="btn-dark-mode" class="icon-btn" aria-label="Ganti mode gelap/terang">🌙</button>
  </header>

  <main id="app-content" role="main" aria-live="polite"></main>

  <nav id="app-nav" aria-label="Navigasi utama">
    <a href="#/" class="nav-item" data-page="home">
      <span class="nav-icon" aria-hidden="true">🏠</span>
      <span class="nav-label">Beranda</span>
    </a>
    <a href="#/mushaf" class="nav-item" data-page="mushaf">
      <span class="nav-icon" aria-hidden="true">📖</span>
      <span class="nav-label">Mushaf</span>
    </a>
    <a href="#/setoran" class="nav-item" data-page="setoran">
      <span class="nav-icon" aria-hidden="true">🎙️</span>
      <span class="nav-label">Setoran</span>
    </a>
    <a href="#/stats" class="nav-item" data-page="stats">
      <span class="nav-icon" aria-hidden="true">📊</span>
      <span class="nav-label">Statistik</span>
    </a>
    <a href="#/profile" class="nav-item" data-page="profile">
      <span class="nav-icon" aria-hidden="true">👤</span>
      <span class="nav-label">Profil</span>
    </a>
  </nav>

  <button id="fab-mic" class="fab hidden" aria-label="Mulai Setoran Suara">🎙️</button>
</div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/quran-data.js"></script>
<script src="js/mushaf-renderer.js"></script>
<script src="js/progressive-reveal.js"></script>
<script src="js/speech-engine.js"></script>
<script src="js/error-marker.js"></script>
<script src="js/spaced-repetition.js"></script>
<script src="js/gamification.js"></script>
<script src="js/app.js"></script>

</html>
